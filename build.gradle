plugins {
    id 'java'
    id 'application'
}

group = 'com.energytycoon'
version = '1.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

ext { gdxVersion = '1.12.1' }

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.energytycoon.Main'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
    testLogging { events 'passed', 'failed'; showStandardStreams = true }
}

// Tek, bagimsiz calistirilabilir JAR (natives dahil): java -jar energytycoon.jar
tasks.register('fatJar', Jar) {
    group = 'build'
    archiveBaseName = 'energytycoon'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.energytycoon.Main' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'module-info.class'
}

// Headless simulasyon kontrolu: ./gradlew simCheck --args="--months 24 --seed 1"
tasks.register('simCheck', JavaExec) {
    group = 'verification'
    description = 'Oyunu render olmadan koşturur ve aylık ölçümleri yazar.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.energytycoon.harness.SimCheck'
    workingDir = projectDir
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}

tasks.register('balanceCheck', JavaExec) {
    group = 'verification'
    description = 'Denge ölçümü: 10 yıl (rakip TM/yükseltme, UŞİ oranları, kuyruk, ihaleler) ve senaryo payları (2040).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.energytycoon.harness.BalanceCheck'
    workingDir = projectDir
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dfile.encoding=UTF-8'
}
